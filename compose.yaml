# compose.yaml

name: ${COMPOSE_PROJECT_NAME:-shared}

services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.32.12}
    restart: unless-stopped

    ports:
      - "${SHARED_BIND_IP:-0.0.0.0}:${OLLAMA_HOST_PORT:-11434}:11434"

    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-1m}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}

      # 70k — компромисс между длинным контекстом
      # и ограничением RTX 3090 24 GB.
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-70000}

      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-1}
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-q8_0}

    volumes:
      - ollama-data:/root/.ollama

    networks:
      - ai-shared

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu

    healthcheck:
      test:
        - CMD
        - ollama
        - list
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  n8n-db:
    image: ${N8N_POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${N8N_DB_NAME:-n8n}
      POSTGRES_USER: ${N8N_DB_USER:-n8n}
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:?N8N_DB_PASSWORD must be set in .env}

    volumes:
      - n8n-db-data:/var/lib/postgresql/data

    networks:
      - n8n-internal

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  n8n:
    image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:2.34.5}
    restart: unless-stopped

    depends_on:
      n8n-db:
        condition: service_healthy

    ports:
      - "${N8N_BIND_IP:-127.0.0.1}:${N8N_HOST_PORT:-5678}:5678"

    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?N8N_DB_PASSWORD must be set in .env}
      DB_POSTGRESDB_SCHEMA: public

      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY must be set in .env}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"

      GENERIC_TIMEZONE: ${TIMEZONE:-UTC}
      TZ: ${TIMEZONE:-UTC}

    volumes:
      - n8n-data:/home/node/.n8n

    networks:
      - ai-shared
      - n8n-internal

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:5678/healthz')
          .then(r => process.exit(r.ok ? 0 : 1))
          .catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:4.1-management}
    restart: unless-stopped

    ports:
      - "${RABBITMQ_BIND_IP:-127.0.0.1}:${RABBITMQ_AMQP_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_BIND_IP:-127.0.0.1}:${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-shared_admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS must be set in .env}

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

    networks:
      - ai-shared

    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

networks:
  ai-shared:
    external: true
    name: ${SHARED_NETWORK_NAME:-ai-shared}

  n8n-internal:
    internal: true

volumes:
  ollama-data:
  n8n-data:
  n8n-db-data:
  rabbitmq-data: