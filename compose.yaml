# compose.yaml

name: ${COMPOSE_PROJECT_NAME:-shared}

services:
  # -------------------------------------------------------------------------
  # Shared generation / vision-language inference
  # -------------------------------------------------------------------------
  shared-vlm:
    profiles:
      - ai-vlm

    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.29.0}
    restart: unless-stopped
    ipc: host

    ports:
      - "${SHARED_VLM_BIND_IP:-0.0.0.0}:${SHARED_VLM_HOST_PORT:-8000}:8000"

    environment:
      HF_HOME: /root/.cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
      CUDA_DEVICE_ORDER: ${VLLM_CUDA_DEVICE_ORDER:-PCI_BUS_ID}
      CUDA_VISIBLE_DEVICES: ${SHARED_VLM_GPU_DEVICES:-0}

      # Online reproducibility mode.
      # vLLM must produce the same result for the same request independently
      # of dynamic batch size/order when the same hardware/runtime is used.
      VLLM_BATCH_INVARIANT: ${SHARED_VLM_BATCH_INVARIANT:-0}

    volumes:
      - huggingface-cache:/root/.cache/huggingface
      - vllm-cache:/root/.cache/vllm

    networks:
      - ai-shared

    gpus: all

    command:
      - --model
      - "${SHARED_VLM_MODEL_ID:-Qwen/Qwen3-VL-8B-Instruct}"
      - --revision
      - "${SHARED_VLM_MODEL_REVISION:-main}"
      - --served-model-name
      - "${SHARED_VLM_MODEL_ALIAS:-shared-vlm}"
      - --reasoning-parser
      - qwen3
      - --spec-method
      - mtp
      - --spec-tokens
      - "3"
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --tensor-parallel-size
      - "${SHARED_VLM_TP_SIZE:-1}"
      - --data-parallel-size
      - "${SHARED_VLM_DP_SIZE:-1}"
      - --max-model-len
      - "${SHARED_VLM_MAX_MODEL_LEN:-8192}"
      - --gpu-memory-utilization
      - "${SHARED_VLM_GPU_MEMORY_UTILIZATION:-0.90}"
      - --max-num-seqs
      - "${SHARED_VLM_MAX_NUM_SEQS:-8}"
      - --max-num-queued-reqs
      - "${SHARED_VLM_MAX_NUM_QUEUED_REQS:-32}"
      - --max-num-queued-tokens
      - "${SHARED_VLM_MAX_NUM_QUEUED_TOKENS:-32768}"

    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
              "http://127.0.0.1:8000/health",
              timeout=5,
          )
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 15m

  # -------------------------------------------------------------------------
  # Shared multimodal embedding
  # -------------------------------------------------------------------------
  shared-embedding:
    profiles:
      - ai-embedding

    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.29.0}
    restart: unless-stopped
    ipc: host

    ports:
      - "${SHARED_EMBEDDING_BIND_IP:-0.0.0.0}:${SHARED_EMBEDDING_HOST_PORT:-8001}:8000"

    environment:
      HF_HOME: /root/.cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
      CUDA_DEVICE_ORDER: ${VLLM_CUDA_DEVICE_ORDER:-PCI_BUS_ID}
      CUDA_VISIBLE_DEVICES: ${SHARED_EMBEDDING_GPU_DEVICES:-0}

    volumes:
      - huggingface-cache:/root/.cache/huggingface
      - vllm-cache:/root/.cache/vllm

    networks:
      - ai-shared

    gpus: all

    command:
      - --model
      - "${SHARED_EMBEDDING_MODEL_ID:-Qwen/Qwen3-VL-Embedding-8B}"
      - --revision
      - "${SHARED_EMBEDDING_MODEL_REVISION:-main}"
      - --served-model-name
      - "${SHARED_EMBEDDING_MODEL_ALIAS:-shared-embedding}"
      - --runner
      - pooling
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --tensor-parallel-size
      - "${SHARED_EMBEDDING_TP_SIZE:-1}"
      - --data-parallel-size
      - "${SHARED_EMBEDDING_DP_SIZE:-1}"
      - --max-model-len
      - "${SHARED_EMBEDDING_MAX_MODEL_LEN:-8192}"
      - --gpu-memory-utilization
      - "${SHARED_EMBEDDING_GPU_MEMORY_UTILIZATION:-0.90}"
      - --max-num-seqs
      - "${SHARED_EMBEDDING_MAX_NUM_SEQS:-8}"
      - --max-num-queued-reqs
      - "${SHARED_EMBEDDING_MAX_NUM_QUEUED_REQS:-32}"
      - --max-num-queued-tokens
      - "${SHARED_EMBEDDING_MAX_NUM_QUEUED_TOKENS:-32768}"

    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
              "http://127.0.0.1:8000/health",
              timeout=5,
          )
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 15m

  # -------------------------------------------------------------------------
  # Human-facing shared model UI
  # -------------------------------------------------------------------------
  open-webui:
    profiles:
      - ai-ui

    image: ${OPEN_WEBUI_IMAGE:-ghcr.io/open-webui/open-webui:v0.11.3}
    restart: unless-stopped

    depends_on:
      shared-vlm:
        condition: service_healthy

    ports:
      - "${OPEN_WEBUI_BIND_IP:-0.0.0.0}:${OPEN_WEBUI_HOST_PORT:-3000}:8080"

    environment:
      WEBUI_NAME: ${OPEN_WEBUI_NAME:-Shared AI}
      WEBUI_URL: "http://${SHARED_PUBLIC_HOST:-localhost}:${OPEN_WEBUI_HOST_PORT:-3000}"
      WEBUI_SECRET_KEY: ${OPEN_WEBUI_SECRET_KEY:-CHANGE_ME_GENERATE_WITH_OPENSSL_RAND_HEX_32}

      ENABLE_PERSISTENT_CONFIG: ${OPEN_WEBUI_ENABLE_PERSISTENT_CONFIG:-false}

      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URL: http://shared-vlm:8000/v1
      OPENAI_API_KEY: "unused"

      ENABLE_OLLAMA_API: "false"

    volumes:
      - open-webui-data:/app/backend/data

    networks:
      - ai-shared

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
              "http://127.0.0.1:8080/health",
              timeout=5,
          )
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # -------------------------------------------------------------------------
  # n8n private database
  # -------------------------------------------------------------------------
  n8n-db:
    image: ${N8N_POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${N8N_DB_NAME:-n8n}
      POSTGRES_USER: ${N8N_DB_USER:-n8n}
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:?N8N_DB_PASSWORD must be set in .env or process environment}

    volumes:
      - n8n-db-data:/var/lib/postgresql/data

    networks:
      - n8n-internal

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # -------------------------------------------------------------------------
  # n8n
  # -------------------------------------------------------------------------
  n8n:
    image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:2.34.5}
    restart: unless-stopped

    depends_on:
      n8n-db:
        condition: service_healthy

    ports:
      - "${N8N_BIND_IP:-0.0.0.0}:${N8N_HOST_PORT:-5678}:5678"

    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?N8N_DB_PASSWORD must be set in .env or process environment}
      DB_POSTGRESDB_SCHEMA: public

      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY must be set in .env or process environment}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"

      GENERIC_TIMEZONE: ${TIMEZONE:-UTC}
      TZ: ${TIMEZONE:-UTC}

    volumes:
      - n8n-data:/home/node/.n8n

    networks:
      - ai-shared
      - n8n-internal

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:5678/healthz')
          .then(r => process.exit(r.ok ? 0 : 1))
          .catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # -------------------------------------------------------------------------
  # RabbitMQ
  # -------------------------------------------------------------------------
  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:4.1-management}
    restart: unless-stopped

    ports:
      - "${RABBITMQ_BIND_IP:-0.0.0.0}:${RABBITMQ_AMQP_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_BIND_IP:-0.0.0.0}:${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-shared_admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS must be set in .env or process environment}

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

    networks:
      - ai-shared

    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

networks:
  ai-shared:
    external: true
    name: ${SHARED_NETWORK_NAME:-ai-shared}

  n8n-internal:
    internal: true

volumes:
  huggingface-cache:
  vllm-cache:
  open-webui-data:
  n8n-data:
  n8n-db-data:
  rabbitmq-data: